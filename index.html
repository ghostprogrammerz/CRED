<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRED</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --border:   #1e1e2e;
    --accent:   #e8c547;
    --accent2:  #c94040;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --pill-bg:  #1a1a26;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #loading-screen, #app { display: none; }
  #app { flex-direction: column; min-height: 100vh; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 0;
  }

  .login-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 20vw, 10rem);
    letter-spacing: .12em;
    color: var(--accent);
    line-height: 1;
    margin-bottom: .15em;
    text-shadow: 0 0 80px rgba(232,197,71,.25);
  }

  .login-tagline {
    color: var(--muted);
    font-size: .85rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 2.5rem;
    width: min(380px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .login-box input {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: .95rem;
    padding: .75rem 1rem;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box input::placeholder { color: var(--muted); }

  .btn-primary {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0a0a0f;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .05em;
    padding: .8rem;
    text-transform: uppercase;
    transition: opacity .15s, transform .1s;
  }
  .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); opacity: 1; }

  .login-alt {
    text-align: center;
    font-size: .8rem;
    color: var(--muted);
  }
  .login-alt a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
  }
  .login-alt a:hover { text-decoration: underline; }

  #login-error {
    color: var(--accent2);
    font-size: .82rem;
    text-align: center;
    min-height: 1.2em;
  }

  /* ── LOADING ── */
  #loading-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 1.2rem;
  }
  .loading-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    letter-spacing: .15em;
    color: var(--accent);
  }
  .loading-bar-outer {
    width: 180px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .loading-bar-inner {
    height: 100%;
    background: var(--accent);
    animation: load 1.4s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes load {
    0%   { width: 0%; margin-left: 0; }
    50%  { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }
  .loading-text { color: var(--muted); font-size: .82rem; letter-spacing: .15em; text-transform: uppercase; }

  /* ── APP SHELL ── */
  #app {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.9rem;
    letter-spacing: .12em;
    color: var(--accent);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }

  .user-pill {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: .35rem .9rem;
    font-size: .82rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .user-pill span { color: var(--text); font-weight: 500; }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: .8rem;
    padding: .35rem .75rem;
    transition: color .15s, border-color .15s;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ── NAV ── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    gap: .25rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }

  .nav-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: .85rem;
    font-weight: 500;
    letter-spacing: .06em;
    padding: .85rem 1.1rem;
    text-transform: uppercase;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── MAIN ── */
  main {
    flex: 1;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* ── SECTION HEADER ── */
  .section-header {
    margin-bottom: 1.75rem;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: .08em;
    color: var(--text);
    line-height: 1;
  }
  .section-subtitle {
    color: var(--muted);
    font-size: .82rem;
    margin-top: .35rem;
  }

  /* ── CARD GRID ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: .75rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    padding: .95rem 1rem;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: .6rem;
    font-size: .88rem;
    font-weight: 500;
    transition: border-color .15s, background .15s, transform .1s;
    line-height: 1.3;
  }
  .card:hover {
    border-color: var(--accent);
    background: #16161f;
    transform: translateY(-2px);
  }
  .card:active { transform: translateY(0); }

  .card-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .85rem;
  }

  /* arc type coloring */
  .card[data-type="op"] .card-icon { background: rgba(232,197,71,.12); border-color: rgba(232,197,71,.25); }
  .card[data-type="book"] .card-icon { background: rgba(80,160,230,.12); border-color: rgba(80,160,230,.25); }

  /* ── HOME DASHBOARD ── */
  .home-greeting {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: .06em;
    line-height: 1;
    margin-bottom: .5rem;
  }
  .home-greeting em {
    color: var(--accent);
    font-style: normal;
  }

  .home-sub {
    color: var(--muted);
    font-size: .88rem;
    margin-bottom: 2rem;
  }

  .home-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  .home-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    padding: 1.5rem;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .home-card:hover {
    border-color: var(--accent);
    background: #16161f;
    transform: translateY(-3px);
  }
  .home-card-icon { font-size: 1.8rem; margin-bottom: .75rem; }
  .home-card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: .06em;
    color: var(--text);
    margin-bottom: .3rem;
  }
  .home-card-desc { color: var(--muted); font-size: .8rem; line-height: 1.5; }

  /* ── ADMIN FORM ── */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 540px;
  }
  .form-row { display: flex; flex-direction: column; gap: .4rem; }
  .form-row label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
  .form-row input, .form-row select {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: .9rem;
    padding: .65rem .9rem;
    outline: none;
    transition: border-color .2s;
  }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row input::placeholder { color: var(--muted); }
  .form-row select option { background: var(--surface); }

  /* ── SECTION TABS (series switcher inside movies/books) ── */
  .series-tabs {
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .series-tab {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: .82rem;
    font-weight: 500;
    padding: .4rem 1rem;
    transition: color .15s, border-color .15s, background .15s;
  }
  .series-tab:hover { color: var(--text); border-color: var(--muted); }
  .series-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(232,197,71,.08); }

  .series-panel { display: none; }
  .series-panel.active { display: block; }

  /* manage list */
  .manage-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .6rem 1rem;
    margin-bottom: .5rem;
    font-size: .85rem;
    gap: 1rem;
  }
  .manage-item-info { flex: 1; min-width: 0; }
  .manage-item-title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .manage-item-meta { color: var(--muted); font-size: .75rem; margin-top: .15rem; }
  .del-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent2);
    cursor: pointer;
    font-size: .75rem;
    padding: .3rem .6rem;
    flex-shrink: 0;
    transition: background .15s;
  }
  .del-btn:hover { background: rgba(201,64,64,.12); }

  /* ── RESPONSIVE ── */
  /* ── MOBILE ── */
  @media (max-width: 600px) {
    /* login */
    .login-logo { font-size: clamp(4rem, 22vw, 7rem); }
    .login-box { padding: 1.5rem 1.25rem; }

    /* shell */
    header { padding: 0 1rem; height: 50px; }
    .header-logo { font-size: 1.5rem; }
    .user-pill { display: none; }
    nav { padding: 0 .5rem; }
    .nav-btn { font-size: .75rem; padding: .75rem .7rem; letter-spacing: .03em; }

    /* content */
    main { padding: 1rem; }
    .section-title { font-size: 1.6rem; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .5rem; }
    .card { font-size: .8rem; padding: .75rem .7rem; }
    .card-icon { width: 24px; height: 24px; font-size: .75rem; }

    /* home */
    .home-greeting { font-size: clamp(1.6rem, 8vw, 2.5rem); }
    .home-cards { grid-template-columns: 1fr 1fr; }
    .home-card { padding: 1.1rem; }
    .home-card-icon { font-size: 1.4rem; margin-bottom: .5rem; }
    .home-card-title { font-size: 1rem; }

    /* series tabs */
    .series-tab { font-size: .75rem; padding: .35rem .75rem; }

    /* admin form */
    .add-form { padding: 1.25rem; }
  }

  /* ── TOUCH: bigger tap targets ── */
  @media (hover: none) and (pointer: coarse) {
    .card { min-height: 52px; }
    .nav-btn { min-height: 44px; }
    .btn-primary { min-height: 50px; font-size: 1rem; }
    .login-box input { min-height: 50px; font-size: 1rem; }
    .series-tab { min-height: 36px; }
  }

  /* ── DESKTOP: max-width container ── */
  @media (min-width: 1024px) {
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .home-cards { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">CRED</div>
  <div class="login-tagline">Coconut Republic Entertainment</div>
  <div class="login-box">
    <input type="text" id="login-name" placeholder="Username" autocomplete="off" spellcheck="false">
    <input type="password" id="login-pass" placeholder="Password">
    <div id="login-error"></div>
    <button class="btn-primary" onclick="doLogin()">Enter</button>
    <div class="login-alt">
      New here? <a onclick="goToJoin()">Join the republic</a>
    </div>
  </div>
</div>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-logo">CRED</div>
  <div class="loading-bar-outer"><div class="loading-bar-inner"></div></div>
  <div class="loading-text">Loading...</div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo">CRED</div>
    <div class="header-right">
      <div class="user-pill">Logged in as <span id="username-display"></span></div>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="showSection('home', this)">Home</button>
    <button class="nav-btn" onclick="showSection('movies', this)">Movies</button>
    <button class="nav-btn" onclick="showSection('books', this)">Books</button>
    <button class="nav-btn" id="admin-nav-btn" onclick="showSection('admin', this)" style="display:none">+ Add</button>
  </nav>

  <main>

    <!-- HOME -->
    <div id="sec-home" class="section active">
      <div class="home-greeting">Welcome back, <em id="home-username"></em></div>
      <div class="home-sub">What are you watching today?</div>
      <div class="home-cards">
        <div class="home-card" onclick="showSection('movies', document.querySelectorAll('.nav-btn')[1])">
          <div class="home-card-icon">🎬</div>
          <div class="home-card-title">Movies</div>
          <div class="home-card-desc" id="home-movies-desc"></div>
        </div>
        <div class="home-card" onclick="showSection('books', document.querySelectorAll('.nav-btn')[2])">
          <div class="home-card-icon">📚</div>
          <div class="home-card-title">Books</div>
          <div class="home-card-desc" id="home-books-desc"></div>
        </div>
      </div>
    </div>

    <!-- MOVIES -->
    <div id="sec-movies" class="section">
      <div id="movies-content"></div>
    </div>

    <!-- BOOKS -->
    <div id="sec-books" class="section">
      <div id="books-content"></div>
    </div>

    <!-- ADMIN -->
    <div id="sec-admin" class="section">
      <div class="section-header">
        <div class="section-title">➕ Add Content</div>
        <div class="section-subtitle">Adds to this browser only (localStorage)</div>
      </div>
      <div class="add-form">
        <div class="form-row">
          <label>Section</label>
          <select id="add-section" onchange="updateSeriesOptions()">
            <option value="movies">Movies</option>
            <option value="books">Books</option>
          </select>
        </div>
        <div class="form-row">
          <label>Series / Group</label>
          <div style="display:flex;gap:.5rem">
            <select id="add-series-select" style="flex:1"></select>
            <span style="color:var(--muted);align-self:center;font-size:.8rem">or</span>
            <input id="add-series-new" placeholder="New series name" style="flex:1">
          </div>
        </div>
        <div class="form-row">
          <label>Title</label>
          <input id="add-title" placeholder="e.g. Order of the Phoenix">
        </div>
        <div class="form-row">
          <label>Link</label>
          <input id="add-link" placeholder="https://...">
        </div>
        <div id="add-error" style="color:var(--accent2);font-size:.82rem;min-height:1.2em"></div>
        <button class="btn-primary" style="width:auto;padding:.75rem 2rem" onclick="addItem()">Add</button>
      </div>

      <div style="margin-top:2.5rem">
        <div class="section-title" style="font-size:1.4rem;margin-bottom:1rem">Manage existing</div>
        <div id="manage-list"></div>
      </div>
    </div>

  </main>
</div>

async function ikeleneGet(key) {
  const res = await fetch(API_URL + 'get.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ apiKey: API_KEY, key })
  });
  const result = await res.json();
  if (result && result.data && result.data.value != null) return result.data.value;
  if (result && result.value != null) return result.value;
  return '';
}

// ── STATE (merges defaults with anything saved in localStorage) ──
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved) return saved;
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA)); // deep clone
}
function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
}
let STATE = loadState();

// ── AUTH ──
const ADMIN_USERS = ['RCB'];
let currentUser = null;

async function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err  = document.getElementById('login-error');
  err.textContent = '';
  if (!name || !pass) { err.textContent = 'Enter username and password.'; return; }

  showLoading();
  try {
    const raw = await ikeleneGet('credentials');
    let creds = {};
    if (raw && raw.trim()) {
      creds = JSON.parse(raw);
      delete creds[''];
    }
    const stored = creds[name];
    const pw = typeof stored === 'object' ? stored.password : stored;
    if (pw === pass) {
      currentUser = name;
      hideLoading(false);
      showApp();
    } else {
      hideLoading(true);
      err.textContent = 'Wrong username or password.';
    }
  } catch(e) {
    hideLoading(true);
    err.textContent = 'Error contacting server. Try again.';
  }
}

function goToJoin() {
  window.open('https://ghostprogrammerz.github.io/CRB/', '_blank', 'noopener');
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').textContent = '';
}

// ── SCREENS ──
function showLoading() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
}
function hideLoading(showLogin) {
  document.getElementById('loading-screen').style.display = 'none';
  if (showLogin) document.getElementById('login-screen').style.display = 'flex';
}
function showApp() {
  document.getElementById('username-display').textContent = currentUser;
  document.getElementById('home-username').textContent = currentUser;
  if (ADMIN_USERS.includes(currentUser)) {
    document.getElementById('admin-nav-btn').style.display = '';
  }
  document.getElementById('app').style.display = 'flex';
  renderAll();
}

// ── RENDER ──
function openLink(url) {
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

const SECTION_ICONS = {
  movies: { "One Piece": "🏴‍☠️", "Harry Potter": "⚡", _default: "🎬" },
  books:  { "Diary of a Wimpy Kid": "📖", _default: "📚" },
};

function iconFor(section, series) {
  const map = SECTION_ICONS[section] || {};
  return map[series] || map._default || "📄";
}

function buildSeriesBlock(section, series, items) {
  const icon = iconFor(section, series);
  const grid = document.createElement('div');
  grid.className = 'card-grid';
  items.forEach(([name, url]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-type', section === 'books' ? 'book' : 'op');
    card.innerHTML = `<div class="card-icon">${icon}</div>${name}`;
    card.onclick = () => openLink(url);
    grid.appendChild(card);
  });
  return grid;
}

function renderSection(sectionId, containerId, titleIcon, titleText) {
  const data = STATE[sectionId]; // { seriesName: [[title, url], ...] }
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  const seriesNames = Object.keys(data);

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  const totalItems = seriesNames.reduce((s, k) => s + data[k].length, 0);
  hdr.innerHTML = `
    <div class="section-title">${titleIcon} ${titleText}</div>
    <div class="section-subtitle">${seriesNames.join(' · ')} · ${totalItems} items</div>
  `;
  container.appendChild(hdr);

  if (seriesNames.length === 1) {
    // Single series — no tabs needed
    container.appendChild(buildSeriesBlock(sectionId, seriesNames[0], data[seriesNames[0]]));
  } else {
    // Tabs
    const tabs = document.createElement('div');
    tabs.className = 'series-tabs';
    const panels = document.createElement('div');

    seriesNames.forEach((series, i) => {
      const tab = document.createElement('button');
      tab.className = 'series-tab' + (i === 0 ? ' active' : '');
      tab.textContent = series;
      tab.onclick = () => {
        tabs.querySelectorAll('.series-tab').forEach(t => t.classList.remove('active'));
        panels.querySelectorAll('.series-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        panels.children[i].classList.add('active');
      };
      tabs.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'series-panel' + (i === 0 ? ' active' : '');
      panel.appendChild(buildSeriesBlock(sectionId, series, data[series]));
      panels.appendChild(panel);
    });

    container.appendChild(tabs);
    container.appendChild(panels);
  }
}

function renderAll() {
  renderSection('movies', 'movies-content', '🎬', 'Movies');
  renderSection('books',  'books-content',  '📚', 'Books');

  // Home desc
  const mSeries = Object.keys(STATE.movies);
  const bSeries = Object.keys(STATE.books);
  const mCount  = mSeries.reduce((s,k) => s + STATE.movies[k].length, 0);
  const bCount  = bSeries.reduce((s,k) => s + STATE.books[k].length, 0);
  document.getElementById('home-movies-desc').textContent =
    mSeries.join(', ') + ` · ${mCount} items`;
  document.getElementById('home-books-desc').textContent =
    bSeries.join(', ') + ` · ${bCount} items`;

  updateSeriesOptions();
  renderManageList();
}

// ── ADMIN: ADD ──
function updateSeriesOptions() {
  const section = document.getElementById('add-section').value;
  const sel = document.getElementById('add-series-select');
  sel.innerHTML = '';
  Object.keys(STATE[section]).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function addItem() {
  const section   = document.getElementById('add-section').value;
  const selSeries = document.getElementById('add-series-select').value;
  const newSeries = document.getElementById('add-series-new').value.trim();
  const title     = document.getElementById('add-title').value.trim();
  const link      = document.getElementById('add-link').value.trim();
  const err       = document.getElementById('add-error');
  err.textContent = '';

  const series = newSeries || selSeries;
  if (!series) { err.textContent = 'Choose or name a series.'; return; }
  if (!title)  { err.textContent = 'Enter a title.'; return; }
  if (!link)   { err.textContent = 'Enter a link.'; return; }
  try { new URL(link); } catch(e) { err.textContent = 'Not a valid URL.'; return; }

  if (!STATE[section][series]) STATE[section][series] = [];
  STATE[section][series].push([title, link]);
  saveState();

  document.getElementById('add-series-new').value = '';
  document.getElementById('add-title').value = '';
  document.getElementById('add-link').value = '';
  err.textContent = '';
  err.style.color = '#5cb85c';
  err.textContent = `"${title}" added to ${series}.`;
  setTimeout(() => { err.textContent = ''; err.style.color = ''; }, 2500);

  updateSeriesOptions();
  renderManageList();
  renderSection(section, section + '-content',
    section === 'movies' ? '🎬' : '📚',
    section === 'movies' ? 'Movies' : 'Books');
}

// ── ADMIN: MANAGE ──
function renderManageList() {
  const container = document.getElementById('manage-list');
  container.innerHTML = '';
  ['movies','books'].forEach(section => {
    Object.entries(STATE[section]).forEach(([series, items]) => {
      items.forEach(([title, url], idx) => {
        const row = document.createElement('div');
        row.className = 'manage-item';
        row.innerHTML = `
          <div class="manage-item-info">
            <div class="manage-item-title">${title}</div>
            <div class="manage-item-meta">${section} › ${series}</div>
          </div>
          <button class="del-btn">Remove</button>
        `;
        row.querySelector('.del-btn').onclick = () => {
          STATE[section][series].splice(idx, 1);
          if (STATE[section][series].length === 0) delete STATE[section][series];
          saveState();
          renderManageList();
          renderSection(section, section + '-content',
            section === 'movies' ? '🎬' : '📚',
            section === 'movies' ? 'Movies' : 'Books');
          updateSeriesOptions();
        };
        container.appendChild(row);
      });
    });
  });
  if (!container.childElementCount) {
    container.innerHTML = '<p style="color:var(--muted);font-size:.85rem">Nothing to manage yet.</p>';
  }
}

// ── NAVIGATION ──
function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
}

// ── Enter key on login ──
['login-name','login-pass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});
